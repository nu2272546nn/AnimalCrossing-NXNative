
name: Animal Crossing New Horizons - Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GAME_TITLE_ID: "01006F8002326000"
      GAME_VERSION: "v2228224"

    steps:
      # 1. Checkout
      - name: Checkout NXNative
        uses: actions/checkout@v4

      # 2. Prepare paths
      - name: Prepare folders
        shell: bash
        run: |
          set -euo pipefail

          echo "INPUT_DIR=$RUNNER_TEMP/animal-crossing-input" >> "$GITHUB_ENV"
          echo "WORK_DIR=$RUNNER_TEMP/animal-crossing-build" >> "$GITHUB_ENV"
          echo "KEYS_FILE=$RUNNER_TEMP/prod.keys" >> "$GITHUB_ENV"
          echo "IPA_FILE=$RUNNER_TEMP/AnimalCrossingNewHorizons.ipa" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=$RUNNER_TEMP/animal-crossing-output" >> "$GITHUB_ENV"

          mkdir -p "$RUNNER_TEMP/animal-crossing-input"
          mkdir -p "$RUNNER_TEMP/animal-crossing-build"
          mkdir -p "$RUNNER_TEMP/animal-crossing-output"

          echo "Folders prepared"
          df -h

      # 3. Free disk space
      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail

          echo "Disk before cleanup:"
          df -h

          xcrun simctl delete unavailable || true

          sudo rm -rf \
            /Library/Developer/CoreSimulator/Volumes/iOS_* \
            /Library/Developer/CoreSimulator/Caches \
            "$HOME/Library/Developer/Xcode/DerivedData" \
            "$HOME/Library/Developer/Xcode/Archives" \
            "$HOME/Library/Android" \
            /usr/local/share/powershell \
            /usr/share/dotnet \
            || true

          brew cleanup -s || true
          rm -rf "$HOME/.cache/pip" "$HOME/.npm" || true

          echo "Disk after cleanup:"
          df -h

      # 4. Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 5. Xcode and Metal
      - name: Check Xcode and install Metal Toolchain
        shell: bash
        run: |
          set -euo pipefail

          echo "Developer directory:"
          echo "$DEVELOPER_DIR"

          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

          xcodebuild -downloadComponent MetalToolchain

      # 6. NXNative dependencies
      - name: Install NXNative dependencies
        shell: bash
        run: |
          set -euo pipefail

          brew install xcodegen zstd glslang

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            lz4 \
            "capstone>=5,<6" \
            fonttools \
            zbic \
            "backports.zstd; python_version < '3.14'"

          python3 - <<'PY'
          import lz4
          import capstone
          import fontTools
          import zbic

          print("NXNative Python dependencies OK")
          PY

      # 7. Google Drive downloader
      - name: Install Google Drive downloader
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade gdown
          gdown --version

      # 8. Download Base NSP
      - name: Download Animal Crossing Base NSP
        shell: bash
        run: |
          set -euo pipefail

          URL="https://drive.google.com/uc?id=1MEt3kilLWTZflqGpqnUa1eehWtDxOCpS"
          OUTPUT="$INPUT_DIR/AnimalCrossing_Base.nsp"

          DOWNLOADED=false

          for attempt in 1 2 3; do
            if gdown "$URL" -O "$OUTPUT"; then
              if [ -s "$OUTPUT" ]; then
                DOWNLOADED=true
                break
              fi
            fi

            rm -f "$OUTPUT"
            echo "Base download attempt $attempt failed"
            sleep 5
          done

          if [ "$DOWNLOADED" != "true" ]; then
            echo "Base NSP download failed"
            exit 1
          fi

          echo "Base NSP downloaded:"
          ls -lh "$OUTPUT"

      # 9. Download Update NSP
      - name: Download Animal Crossing Update 3.0.3 NSP
        shell: bash
        run: |
          set -euo pipefail

          URL="https://drive.google.com/uc?id=1aBtoEnV0w259-x8ijFY4tKQSxE9aACjd"
          OUTPUT="$INPUT_DIR/AnimalCrossing_Update_3.0.3.nsp"

          DOWNLOADED=false

          for attempt in 1 2 3; do
            if gdown "$URL" -O "$OUTPUT"; then
              if [ -s "$OUTPUT" ]; then
                DOWNLOADED=true
                break
              fi
            fi

            rm -f "$OUTPUT"
            echo "Update download attempt $attempt failed"
            sleep 5
          done

          if [ "$DOWNLOADED" != "true" ]; then
            echo "Update NSP download failed"
            exit 1
          fi

          echo "Update NSP downloaded:"
          ls -lh "$OUTPUT"

      # 10. Download prod.keys
      - name: Download prod.keys
        shell: bash
        run: |
          set -euo pipefail

          URL="https://drive.google.com/uc?id=1DCVsXGpTGvo8NpcsjlrEfGlmWRCNW7WQ"

          DOWNLOADED=false

          for attempt in 1 2 3; do
            if gdown "$URL" -O "$KEYS_FILE"; then
              if [ -s "$KEYS_FILE" ]; then
                DOWNLOADED=true
                break
              fi
            fi

            rm -f "$KEYS_FILE"
            echo "Keys download attempt $attempt failed"
            sleep 5
          done

          if [ "$DOWNLOADED" != "true" ]; then
            echo "prod.keys download failed"
            exit 1
          fi

          chmod 600 "$KEYS_FILE"
          echo "prod.keys downloaded successfully"

      # 11. Validate downloaded files
      - name: Validate input files
        shell: bash
        run: |
          set -euo pipefail

          BASE="$INPUT_DIR/AnimalCrossing_Base.nsp"
          UPDATE="$INPUT_DIR/AnimalCrossing_Update_3.0.3.nsp"

          test -s "$BASE"
          test -s "$UPDATE"
          test -s "$KEYS_FILE"

          python3 - "$BASE" "$UPDATE" <<'PY'
          import sys
          from pathlib import Path

          for name in sys.argv[1:]:
              path = Path(name)

              with path.open("rb") as f:
                  magic = f.read(4)

              if magic != b"PFS0":
                  raise SystemExit(
                      f"Invalid NSP container or incomplete download: {path.name}"
                  )

              print(
                  f"NSP container OK: {path.name} "
                  f"({path.stat().st_size:,} bytes)"
              )
          PY

          NSP_COUNT=$(find "$INPUT_DIR" -maxdepth 1 -type f \
            \( -iname "*.nsp" -o -iname "*.nsz" -o -iname "*.xci" -o -iname "*.xcz" \) \
            | wc -l | tr -d ' ')

          if [ "$NSP_COUNT" -ne 2 ]; then
            echo "Expected exactly 2 game containers, found $NSP_COUNT"
            exit 1
          fi

          echo "Base + Update only. No DLC container."
          echo "Available disk:"
          df -h

      # 12. Build IPA + separate RomFS directly from NSP
      - name: Build Animal Crossing IPA and separate RomFS
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/build_ipa_from_nsp.py \
            "$INPUT_DIR" \
            -k "$KEYS_FILE" \
            --title-id "$GAME_TITLE_ID" \
            --package "$GAME_VERSION" \
            --work-dir "$WORK_DIR" \
            -o "$IPA_FILE" \
            --romfs separate \
            --keep-extracted \
            --progress lines

      # 13. Collect outputs
      - name: Collect build outputs
        if: always()
        shell: bash
        run: |
          set -u

          mkdir -p "$OUTPUT_DIR"

          echo "Checking IPA..."

          if [ -s "$IPA_FILE" ]; then
            cp "$IPA_FILE" "$OUTPUT_DIR/AnimalCrossingNewHorizons.ipa"
            ls -lh "$OUTPUT_DIR/AnimalCrossingNewHorizons.ipa"
          else
            echo "IPA not available"
          fi

          echo "Searching for RomFS..."

          if [ -d "$WORK_DIR/extract" ]; then
            ROMFS_FILE=$(find "$WORK_DIR/extract" \
              -type f \
              -name "RomFS.img" \
              -print -quit)

            if [ -n "$ROMFS_FILE" ] && [ -s "$ROMFS_FILE" ]; then
              cp "$ROMFS_FILE" "$OUTPUT_DIR/RomFS.img"
              echo "RomFS collected:"
              ls -lh "$OUTPUT_DIR/RomFS.img"
            else
              echo "RomFS.img not found"
            fi
          else
            echo "Extract directory not found"
          fi

          echo "Collecting logs..."

          if [ -d "$WORK_DIR/logs" ]; then
            mkdir -p "$OUTPUT_DIR/logs"
            cp -R "$WORK_DIR/logs/." "$OUTPUT_DIR/logs/" || true
          fi

          echo "Available output files:"
          find "$OUTPUT_DIR" -maxdepth 3 -type f -print

      # 14. Upload IPA + RomFS + logs
      - name: Upload Animal Crossing build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AnimalCrossing-NXNative-iOS
          path: ${{ runner.temp }}/animal-crossing-output/
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn

      # 15. Cleanup sensitive files
      - name: Cleanup sensitive files
        if: always()
        shell: bash
        run: |
          set +e

          rm -f "$KEYS_FILE"

          rm -f "$INPUT_DIR"/*.nsp
          rm -f "$INPUT_DIR"/*.nsz
          rm -f "$INPUT_DIR"/*.xci
          rm -f "$INPUT_DIR"/*.xcz

          echo "prod.keys and NSP files cleaned up"
