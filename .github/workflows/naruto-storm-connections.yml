
name: Naruto Storm Connections - Build iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 360

    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      GAME_TITLE_ID: "0100D2D0190A4000"
      GAME_VERSION: "v0"
      GAME_NAME: "NarutoStormConnections"

    steps:
      - name: Checkout NXNative
        uses: actions/checkout@v4

      - name: Prepare folders
        shell: bash
        run: |
          set -euo pipefail
          echo "INPUT_DIR=$RUNNER_TEMP/naruto-input" >> "$GITHUB_ENV"
          echo "WORK_DIR=$RUNNER_TEMP/naruto-build" >> "$GITHUB_ENV"
          echo "KEYS_FILE=$RUNNER_TEMP/prod.keys" >> "$GITHUB_ENV"
          echo "IPA_FILE=$RUNNER_TEMP/NarutoStormConnections.ipa" >> "$GITHUB_ENV"
          echo "OUTPUT_DIR=$RUNNER_TEMP/naruto-output" >> "$GITHUB_ENV"

          mkdir -p "$RUNNER_TEMP/naruto-input"
          mkdir -p "$RUNNER_TEMP/naruto-build"
          mkdir -p "$RUNNER_TEMP/naruto-output"

          df -h

      - name: Check Xcode and disk
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun -f metal
          df -h

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen zstd glslang
          python3 -m pip install --upgrade pip
          python3 -m pip install \
            lz4 \
            "capstone>=5,<6" \
            fonttools \
            zbic \
            "backports.zstd; python_version < '3.14'"

      - name: Install Google Drive downloader
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade gdown

      - name: Download game NSP
        shell: bash
        env:
          NSP_URL: ${{ secrets.NARUTO_STORM_CONNECTIONS_NSP_URL }}
        run: |
          set -euo pipefail

          if [ -z "$NSP_URL" ]; then
            echo "Missing NARUTO_STORM_CONNECTIONS_NSP_URL secret"
            exit 1
          fi

          gdown "$NSP_URL" \
            -O "$INPUT_DIR/NarutoStormConnections.nsp"

          test -s "$INPUT_DIR/NarutoStormConnections.nsp"

      - name: Download prod.keys
        shell: bash
        env:
          KEYS_URL: ${{ secrets.NX_PROD_KEYS_URL }}
        run: |
          set -euo pipefail

          if [ -z "$KEYS_URL" ]; then
            echo "Missing NX_PROD_KEYS_URL secret"
            exit 1
          fi

          gdown "$KEYS_URL" -O "$KEYS_FILE"
          test -s "$KEYS_FILE"
          chmod 600 "$KEYS_FILE"

      - name: Validate NSP
        shell: bash
        run: |
          set -euo pipefail

          python3 - "$INPUT_DIR/NarutoStormConnections.nsp" <<'PY'
          import sys
          from pathlib import Path

          p = Path(sys.argv[1])
          with p.open("rb") as f:
              magic = f.read(4)

          if magic != b"PFS0":
              raise SystemExit("Invalid NSP container")

          print(f"NSP OK: {p.stat().st_size:,} bytes")
          PY

      - name: Check profile status
        shell: bash
        run: |
          set -euo pipefail

          PROFILE="dm/games/$GAME_TITLE_ID"

          if [ -d "$PROFILE" ]; then
            echo "Existing Naruto profile found"
            find "$PROFILE" -maxdepth 2 -type f -print
          else
            echo "No Storm Connections profile found."
            echo "A provisional profile must be generated by NXNative."
          fi

      - name: Build IPA and separate RomFS
        shell: bash
        run: |
          set -euo pipefail

          python3 scripts/build_ipa_from_nsp.py \
            "$INPUT_DIR" \
            -k "$KEYS_FILE" \
            --title-id "$GAME_TITLE_ID" \
            --package "$GAME_VERSION" \
            --work-dir "$WORK_DIR" \
            -o "$IPA_FILE" \
            --platform ios \
            --romfs separate \
            --keep-extracted \
            --progress lines

          test -s "$IPA_FILE"

      - name: Collect outputs
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p "$OUTPUT_DIR"

          if [ -s "$IPA_FILE" ]; then
            cp "$IPA_FILE" "$OUTPUT_DIR/"
          fi

          for DIR in logs profile; do
            if [ -d "$WORK_DIR/$DIR" ]; then
              mkdir -p "$OUTPUT_DIR/$DIR"
              cp -R "$WORK_DIR/$DIR/." "$OUTPUT_DIR/$DIR/" || true
            fi
          done

          if [ -d "$WORK_DIR/extract" ]; then
            find "$WORK_DIR/extract" -maxdepth 3 -type f \
              -name "RomFS.img" \
              -exec cp {} "$OUTPUT_DIR/" \; || true
          fi

          if [ -d "$INPUT_DIR/${GAME_TITLE_ID}_survey" ]; then
            cp -R "$INPUT_DIR/${GAME_TITLE_ID}_survey" \
              "$OUTPUT_DIR/survey"
          fi

          find "$OUTPUT_DIR" -maxdepth 4 -type f -print

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Naruto-Storm-Connections-NXNative-iOS
          path: ${{ runner.temp }}/naruto-output/
          compression-level: 0
          retention-days: 7
          if-no-files-found: warn

      - name: Cleanup sensitive files
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "$KEYS_FILE"
          rm -f "$INPUT_DIR"/*.nsp
